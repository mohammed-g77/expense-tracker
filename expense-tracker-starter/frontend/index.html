<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
     body {
      background-color: #f8f9fa; 
    }
  </style>
</head>
<body>

  
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    </div>
  </nav>

  <div class="container">
    
     
    <div class="row mb-4">
      <!-- Total Card -->
      <div class="col-md-4">
        <div class="card text-center shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <p class="text-muted mb-1">Total</p>
            <h2 class="fw-bold mb-0" id="summary-total">0.00</h2>
          </div>
        </div>
      </div>
      
      <div class="col-md-4">
        <div class="card text-center shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <p class="text-muted mb-1">Number of expenses</p>
            <h2 class="fw-bold mb-0" id="summary-count">0</h2>
          </div>
        </div>
      </div>
       
      <div class="col-md-4">
        <div class="card text-center shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <p class="text-muted mb-1">Highest expense</p>
            <h2 class="fw-bold mb-1" id="summary-highest-amount">0.00</h2>
            <small class="text-muted" id="summary-highest-title">-</small>
          </div>
        </div>
      </div>
    </div>

   
    <div class="card shadow-sm mb-4">
      <div class="card-body p-4">
        <h5 class="card-title mb-4">Add expense</h5>
        <form id="add-expense-form" novalidate>
          <div class="row g-3">
            <!-- Title -->
            <div class="col-md-3">
              <label for="expense-title" class="form-label text-muted">Title</label>
              <!-- أضف كلاس 'is-invalid' من خلال JS لإظهار الخطأ كما في الصورة -->
              <input type="text" class="form-control" id="expense-title" placeholder="Lunch" required>
              <div class="invalid-feedback">
                Title is required.
              </div>
            </div>
            <!-- Amount -->
            <div class="col-md-3">
              <label for="expense-amount" class="form-label text-muted">Amount</label>
              <input type="number" step="0.01" class="form-control" id="expense-amount" placeholder="4.50" required>
              <div class="invalid-feedback">
                Enter an amount greater than 0.
              </div>
            </div>
            <!-- Category -->
            <div class="col-md-3">
              <label for="expense-category" class="form-label text-muted">Category</label>
              <select class="form-select" id="expense-category" required>
                <option value="" selected disabled>Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilities</option>
              </select>
              <div class="invalid-feedback">
                Choose a category.
              </div>
            </div>
            <!-- Date -->
            <div class="col-md-3">
              <label for="expense-date" class="form-label text-muted">Date</label>
              <input type="date" class="form-control" id="expense-date" required>
            </div>
          </div>
          <div class="mt-4">
            <button type="submit" class="btn btn-primary px-4 py-2" style="background-color: #5b6cf2; border-color: #5b6cf2;">Add expense</button>
          </div>
        </form>
      </div>
    </div>

  
    <div class="card shadow-sm mb-5">
      <div class="card-body p-4">
        
         
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 class="card-title mb-0">Expenses</h5>
          <div class="d-flex align-items-center">
            <label for="filter-category" class="me-2 text-muted mb-0">Category</label>
            <select class="form-select w-auto" id="filter-category">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Utilities">Utilities</option>
            </select>
          </div>
        </div>

         
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th scope="col" class="border-0">Title</th>
                <th scope="col" class="border-0">Amount</th>
                <th scope="col" class="border-0">Category</th>
                <th scope="col" class="border-0">Date</th>
                <th scope="col" class="border-0 text-end">Actions</th>
              </tr>
            </thead>
            <!-- The table rows must be built with JavaScript -->
            <tbody id="expenses-table-body">
              <!-- سيتم حقن الصفوف هنا بواسطة JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>  

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
